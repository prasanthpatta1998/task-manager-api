openapi: 3.0.3
info:
  title: Task Manager API
  version: 1.0.0
  description: REST API for the Task Manager application.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /:
    get:
      summary: API metadata
      responses:
        "200":
          description: API metadata
  /auth/me:
    get:
      summary: Get the current Cognito-authenticated identity
      security:
        - CognitoBearer: []
      responses:
        "200":
          description: Verified identity
        "401":
          description: Missing, invalid, or expired access token
  /tasks:
    get:
      summary: List tasks owned by the authenticated user
      security:
        - CognitoBearer: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [todo, in_progress, done] }
        - in: query
          name: priority
          schema: { type: string, enum: [low, medium, high] }
      responses:
        "200": { description: Paginated task list }
        "401": { description: Missing, invalid, or expired access token }
    post:
      summary: Create a task for the authenticated user
      security:
        - CognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        "201": { description: Task created }
        "400": { description: Invalid input }
        "401": { description: Missing, invalid, or expired access token }
  /tasks/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      summary: Get one task owned by the authenticated user
      security:
        - CognitoBearer: []
      responses:
        "200": { description: Task details }
        "404": { description: Task not found }
    patch:
      summary: Update a task owned by the authenticated user
      security:
        - CognitoBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        "200": { description: Updated task }
        "400": { description: Invalid input or task ID }
        "404": { description: Task not found }
    delete:
      summary: Delete a task owned by the authenticated user
      security:
        - CognitoBearer: []
      responses:
        "204": { description: Task deleted }
        "404": { description: Task not found }
components:
  schemas:
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        status: { type: string, enum: [todo, in_progress, done] }
        priority: { type: string, enum: [low, medium, high] }
        dueDate: { type: string, format: date-time, nullable: true }
  securitySchemes:
    CognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
